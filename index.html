<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout-wrapper">
        
        <!-- Left Panel: Dashboard, Adding Expenses, Filters -->
        <div class="left-panel">
            <header>
                <h1>Expense Tracker</h1>
                <div class="budget-section">
                    <div>
                        <label>Monthly Budget: ₹</label>
                        <input type="number" id="budgetInput" value="10000" />
                        <button id="setBudgetBtn">Set</button>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    <p class="budget-text">Spent: ₹<span id="spentAmount">0</span> / Left: ₹<span id="leftAmount">0</span></p>
                </div>
            </header>
            
            <section class="dashboard">
                <div class="card">
                    <h3>Total Spent</h3>
                    <p class="amount">₹<span id="totalSpent">0</span></p>
                </div>
                <div class="card">
                    <h3>Highest Category</h3>
                    <p class="category" id="highestCategory">None</p>
                </div>
                <div class="card">
                    <h3>Transactions</h3>
                    <p class="count" id="transactionCount">0</p>
                </div>
            </section>

            <section class="add-expense">
                <h2>Add New Expense</h2>
                <form id="expenseForm">
                    <input type="number" id="amount" placeholder="Amount (₹)" required min="1">
                    <select id="category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="description" placeholder="Description" required>
                    <input type="date" id="date" required>
                    <label class="checkbox-label">
                        <input type="checkbox" id="isRecurring"> Recurring?
                    </label>
                    <button type="submit">Add Expense</button>
                </form>
            </section>

            <section class="filters">
                <input type="text" id="searchDesc" placeholder="Search by description...">
                <select id="filterCategory">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </section>
        </div>

        <!-- Right Panel: The Table List -->
        <div class="right-panel">
            <section class="expense-list">
                <h2>Recent Expenses</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBody">
                            <!-- Rows inserted by JS/WebAssembly -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

    </div>
    
    <script src="wasm/expense.js"></script>
    <script src="script.js"></script>
</body>
</html>
